<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <link rel="stylesheet" href="style.css">
    <title>Cloner by Pitt</title>
</head>
<body>
<div class="container">
    <div class="logo">CLONER BY PITT</div>
    <div class="subtitle">SERVER CLONER</div>
    <div class="motto">Гнуть воина — путь клонирования</div>
    <div class="lang">Русский | English</div>

    <div class="tabs">
        <button class="tab active" onclick="showLogin()">Вход</button>
        <button class="tab" onclick="showRegister()">Регистрация</button>
    </div>

    <div id="loginForm">
        <input id="login" placeholder="Логин или email" inputmode="text" autofocus>
        <input id="password" type="password" placeholder="Пароль" inputmode="text">
        <button class="btn-primary" onclick="login()">Войти</button>
        <a class="forgot" href="#">Забыли пароль?</a>
    </div>

    <div id="registerForm" style="display:none">
        <input id="regLogin" placeholder="Логин" inputmode="text">
        <input id="regEmail" placeholder="Email" inputmode="email">
        <input id="regPassword" type="password" placeholder="Пароль" inputmode="text">
        <button class="btn-primary" onclick="register()">Зарегистрироваться</button>
    </div>

    <div class="support">Поддержка</div>
</div>
<script src="script.js"></script>
</body>
</html>
