<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="style.css"><title>Cloner by Pitt</title></head>
<body>
<div class="container">
    <h1>Cloner by Pitt</h1>
    <h2>SERVER CLONER</h2>
    <p>Гнуть воина — путь клонирования</p>
    <div class="lang">Русский | English</div>
    <div class="tabs">
        <button class="active" onclick="showLogin()">Вход</button>
        <button onclick="showRegister()">Регистрация</button>
    </div>
    <div id="loginForm">
        <input id="login" placeholder="Логин или email">
        <input id="password" type="password" placeholder="Пароль">
        <button onclick="login()">Войти</button>
        <a href="#">Забыли пароль?</a>
    </div>
    <div id="registerForm" style="display:none">
        <input id="regLogin" placeholder="Логин">
        <input id="regEmail" placeholder="Email">
        <input id="regPassword" type="password" placeholder="Пароль">
        <button onclick="register()">Зарегистрироваться</button>
    </div>
    <div class="support">Поддержка</div>
</div>
<script src="script.js"></script>
</body>
</html>
