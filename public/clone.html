<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <link rel="stylesheet" href="style.css">
    <title>Cloner by Pitt</title>
</head>
<body>
<div class="container">
    <button class="back-btn" onclick="history.back()">← Назад</button>
    <div class="logo">CLONER BY PITT</div>
    <h3>Клонирование сервера</h3>
    <div class="profile">профиль</div>

    <div class="clone-section">
        <label>Сервер-источник (ID)</label>
        <input id="sourceId" placeholder="Введите ID сервера-источника" inputmode="numeric" autofocus>
        <button class="btn-secondary" onclick="previewStructure()">Просмотр структуры сервера</button>

        <label>Сервер-копия (ID)</label>
        <input id="targetId" placeholder="Введите ID сервера-копии" inputmode="numeric">
    </div>

    <div class="options">
        <h4>Параметры клонирования</h4>
        <label><input type="checkbox" checked> Ролей</label>
        <label><input type="checkbox" checked> Каналов</label>
        <label><input type="checkbox"> Категории</label>
        <label><input type="checkbox" checked> Текстовые каналы</label>
        <label><input type="checkbox" checked> Голосовые каналы</label>
        <label><input type="checkbox"> Форум каналы</label>
        <label><input type="checkbox"> Права доступа</label>
        <label><input type="checkbox" checked> Настройки сервера</label>
        <label><input type="checkbox"> Эмодзи</label>
        <label><input type="checkbox"> Стикеры</label>
        <label><input type="checkbox"> Звуки</label>
    </div>

    <button class="btn-primary" onclick="startClone()">Начать клонирование</button>
    <div id="stats" class="stats">Статистика</div>
    <div class="support">Поддержка</div>
</div>
<script src="script.js"></script>
</body>
</html>
