<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="style.css"><title>Cloner by Pitt</title></head>
<body>
<div class="container">

    <div class="success">Добро пожаловать, <span id="username">danilka</span>! Теперь введите Discord токен</div>
    <div class="user-info">
        <span>Вы вошли как <strong id="userDisplay"></strong></span>

    <div class="support">Поддержка</div>

</div>
